version: '3.8'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: skillforge
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/skillforge
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: secret
      JWT_SECRET: docker-compose-production-secret-change-me
    depends_on:
      - postgres

volumes:
  pgdata: