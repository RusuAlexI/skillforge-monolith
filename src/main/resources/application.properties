spring.application.name=skillforge-monolith
# Connection URL (replace 'localhost', '5432', and 'your_db_name')
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres

# Database credentials
spring.datasource.username=postgres
spring.datasource.password=postgres

# Driver class name (optional in newer Spring Boot versions, but good practice)
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate DDL auto-creation policy (optional: creates tables automatically)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
