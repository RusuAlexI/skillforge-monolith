server.port=8081
spring.application.name=user-service
# Connection URL (replace 'localhost', '5432', and 'your_db_name')
#spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}

# Database credentials
#spring.datasource.username=postgres
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
#spring.datasource.password=postgres
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# Driver class name (optional in newer Spring Boot versions, but good practice)
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate DDL auto-creation policy (optional: creates tables automatically)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

jwt.secret=this-is-a-32-character-secret-key-for-jwt-hs256-algorithm
jwt.expiration-ms=86400000
logging.level.com.skillforge.security=DEBUG
logging.level.org.springframework.security=DEBUG

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/